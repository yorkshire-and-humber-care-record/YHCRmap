       #map {
    height: 600px;
    border: 4px solid #888; /* Dark grey border for a framed look */
    border-radius: 10px; /* Slightly rounded corners */
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* SoFoundation Trust shadow effect */
}


        h1 {
            font-family: Calibri, sans-serif;
        }
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    right: 1.5%;
    top: 15%;
    background-color: white;
    border: 1px solid #ccc;
    padding: 20px;
    border-radius: 10px; /* Slightly rounded corners */
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    width: 30%;  /* Use a percentage of the screen width */
    max-width: 550px;  /* Prevent it from getting too wide */
    min-width: 300px;  /* Prevent it from getting too small */
    max-height: 80vh; /* Replaced max-height: 100%; so to allow for scrollbars on the modal */
    overflow-y: auto;
}

        .modal-header {
            font-size: 20px;
            margin-bottom: 10px;
            font-family: Calibri, sans-serif;
        }
        .modal-table {
            width: 100%;
            border-collapse: collapse;
            font-family: Calibri, sans-serif;
        }
        .modal-table th, .modal-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
 .modal-table th {
    background-color: #2c3e50; /* Dark blue-grey header */
    color: white;
    text-align: left;
    font-weight: bold;
}
.modal-table td {
    background-color: #f8f9fa;
    padding: 10px;
    font-size: 12px;
}

.modal-table td a {
    display: inline-block; 
    text-decoration: none;
    background-color: #3498db; 
    color: white;
    padding: 5px 8px; 
    font-size: 12px; 
    text-align: center;
    border-radius: 4px;
    transition: background 0.3s ease-in-out;
    font-weight: bold;
    width: 180px;
    text-align: center;
}


.modal-table td a:hover {
    background-color: #217dbb;
}
        .close {
            cursor: pointer;
            float: right;
            font-size: 20px;
            margin-top: -10px;
        }
		
				   .toggle-button {
        position: absolute;
        top: 32px;
        right: 10px;
        background-color: white;
        border: 1px solid #ccc;
        padding: 10px 15px;
        font-size: 14px;
        cursor: pointer;
        z-index: 1000;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);

    attribution: 'Data by <a href="http://openstreetmap.org">OpenStreetMap</a>, under <a href="http://www.openstreetmap.org/copyright">ODbL</a>',

});

    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
});

let isProduction = true;

document.getElementById("toggleMapStyle").addEventListener("click", () => {
    isProduction = !isProduction;
    nhsData = isProduction ? nhsDataProduction : nhsDataInProgress;

    // Update button label
    const toggleButton = document.getElementById("toggleMapStyle");
	// previously: toggleButton.textContent = isProduction ? "Live data" : "In Progress";
    toggleButton.textContent = isProduction ? "Toggle between Live and In Progress data" : "Toggle between Live and In Progress data";

    // Update header
    const header = document.getElementById("subheader");
    header.textContent = `Interweave Data Providers by Integrated Care Boards - Data in ${isProduction ? "Production" : "Progress"}`;

    // Refresh modal if it's open
    const modal = document.getElementById("modal");
    if (modal.style.display === "block" && lastSelectedICB) {
        const icbName = lastSelectedICB.feature.properties.ICB23NM;
        const regionCode = regionMapping[icbName];
        showModal(regionCode, icbName);
    }
});

        // Function to display modal with table
function showModal(regionCode, regionName) {
    const modal = document.getElementById("modal");
    const modalHeader = document.getElementById("modal-header");
    const modalTable = document.getElementById("modal-table");

    // Set header
    modalHeader.textContent = `${regionName}`;

    // Build table
    modalTable.innerHTML = `
        <tr>
            <th>Provider</th>
            <th>Resources Available</th>
        </tr>
    `;

    nhsData
        .filter(org => org.region === regionCode)
        .forEach(org => {
            modalTable.innerHTML += `
                <tr>
                    <td>
                        <a href="#" onclick="addProviderMarker('${org.name}')">${org.name}</a>
                    </td>
                    <td>${org.resourcesProvided.join(", ")}</td>
                </tr>
            `;
        });

    // Show modal
    modal.style.display = "block";
}

function addProviderMarker(providerName) {
    // Find the provider in the markers list
    const provider = markers.find(marker => marker.name === providerName);

    //if (!provider) {
    //    alert("Provider location not found!");
    //    return;
    //}

    // Remove existing marker if any
    if (currentMarker) {
        map.removeLayer(currentMarker);
    }

    // Create a new marker for the provider
    currentMarker = L.marker(provider.coords, {
        icon: L.AwesomeMarkers.icon({
            icon: 'info-sign',
            iconColor: 'white',
            markerColor: provider.color,
            prefix: 'glyphicon'
        }),
        title: provider.name
    });

    // Bind a tooltip
    currentMarker.bindTooltip(provider.name, {
        permanent: true,
        direction: "right"
    });

    // Add the marker to the correct map
    currentMarker.addTo(map);

    // Pan the map to the new marker
   map.setView([53.5, -0.6], 8);
}



        // Function to close modal
        function closeModal() {
    const modal = document.getElementById("modal");
    modal.style.display = "none"; // Hide the modal

    // Reset the map view
    map.setView([53.5, -0.6], 8);

    // Reset the last selected ICB to blue
    if (lastSelectedICB) {
        lastSelectedICB.setStyle({ color: "blue" });
        lastSelectedICB = null;
    }

    // Remove any existing markers from the map
    if (currentMarker) {
        map.removeLayer(currentMarker);
        currentMarker = null;
    }
}


        // Fetch GeoJSON data from ArcGIS REST Service
        const geojsonUrl = "https://yorkshire-and-humber-care-record.github.io/YHCRmap/filtered_ICBs.geojson";
	    
       // Store reference to the last selected ICB
let lastSelectedICB = null;

fetch(geojsonUrl)
    .then(response => response.json())
    .then(data => {
        L.geoJSON(data, {
            filter: feature => Object.keys(regionMapping).includes(feature.properties.ICB23NM),
            style: { color: "blue", weight: 2 },
            onEachFeature: (feature, layer) => {
                const icbName = feature.properties.ICB23NM;
                const regionCode = regionMapping[icbName]; 
                const regionName = icbName;

                // Add hover tooltip for all regions
                layer.bindTooltip(regionName, { permanent: false, direction: "top" });

                // Change color to green on hover
                layer.on("mouseover", () => {
                    layer.setStyle({ color: "green" });
                });

                // Reset to original color on mouseout (only if not selected)
                layer.on("mouseout", () => {
                    if (lastSelectedICB !== layer) {
                        layer.setStyle({ color: "blue" });
                    }
                });

                // Click event to highlight selected ICB
                layer.on("click", () => {
                    // Reset previous selected ICB to blue
                    if (lastSelectedICB) {
                        lastSelectedICB.setStyle({ color: "blue" });
                    }

                    // Highlight clicked ICB in red
                    layer.setStyle({ color: "green" });
                    lastSelectedICB = layer; // Store the clicked ICB

                    // Open the modal
                    if (regionCode) {
                        showModal(regionCode, regionName);
                    }
                });
            }
        }).addTo(map);
    })
    .catch(error => console.error("Error loading GeoJSON:", error));
